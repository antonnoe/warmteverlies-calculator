name: Peil-controle

on:
  push:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  peil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Waarden tegen Peil
        run: node tests/peil.test.mjs
